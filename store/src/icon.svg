<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Vault Tidy icon. Chrome Web Store guidance: 96x96 artwork centred in 128x128 with
       transparent padding. A photo tile with the sparkle from the panel's AI loader. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2638" />
      <stop offset="1" stop-color="#16141d" />
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4dbff" />
      <stop offset="0.55" stop-color="#b9a4ff" />
      <stop offset="1" stop-color="#ff9ad5" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="24" fill="url(#tile)" />
  <rect x="16.75" y="16.75" width="94.5" height="94.5" rx="23.25" fill="none" stroke="#b9a4ff" stroke-opacity="0.35" stroke-width="1.5" />
  <!-- hills of a photo -->
  <path d="M28 96 L50 70 L62 82 L76 64 L100 96 Z" fill="#b9a4ff" fill-opacity="0.28" />
  <!-- big sparkle -->
  <g transform="translate(44 26) scale(1.75)">
    <path d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0 Z" fill="url(#spark)" />
  </g>
  <!-- small sparkle -->
  <g transform="translate(83 30) scale(0.62)">
    <path d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0 Z" fill="url(#spark)" />
  </g>
</svg>
